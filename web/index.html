<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#f6f3ec"><title>Miso · 暹罗猫互动实验室</title></head><body><div id="app">
<header><a class="brand" href="./"><span class="brand-mark">m.</span><span>Miso <small>暹罗猫互动实验室</small></span></a><div class="header-right"><span class="pill"><i></i> V0 · 互动体验</span><button id="compare" class="quiet">查看模型改动 ↗</button></div></header>
<main><section class="stage" aria-label="3D 猫互动场景"><canvas id="scene" aria-label="拖动可旋转视角；选择逗猫后移动指针，或选择移动后点击地面"></canvas><div class="stage-title"><span class="eyebrow">MEET YOUR LITTLE COMPANION</span><h1>你好，我是 Miso。</h1><p>一只会看着你、走向你的小猫。</p></div><div id="loading" role="status">正在唤醒 Miso…</div><div class="view-tools" aria-label="模型观察视角"><button data-view="hero" class="selected">3/4</button><button data-view="front">正面</button><button data-view="side">侧面</button><button data-view="back">背面</button><button id="home-view" aria-label="复位视角与位置">↺</button></div><div class="stage-footer"><span id="status" role="status">准备中</span><span id="stats">— FPS</span></div></section>
<aside><div class="panel-heading"><span class="eyebrow">PLAY TOGETHER</span><h2>和它玩一会儿</h2></div><div class="modes" role="group" aria-label="互动方式"><button data-mode="orbit" class="active">观察</button><button data-mode="look">逗猫</button><button data-mode="move">移动</button></div><p class="mode-hint" id="mode-hint">拖动旋转，滚动缩放。看看它圆润的身体和短短的腿。</p>
<label class="range-row">目标高度 <output id="height-value">0.35 m</output><input id="height" type="range" min="0" max="2" step="0.01" value="0.35"></label>
<div class="section-label">动作 <span>12 个已绑定动作</span></div><div class="actions" id="actions"></div>
<button class="demo-button" id="demo"><span>▶</span> 播放 15 秒互动演示</button><button id="stop-demo" class="quiet hidden">停止演示</button>
<details id="debug"><summary>调试与参数 <span>＋</span></summary><div id="debug-controls"></div><div class="toggles"><label><input type="checkbox" id="look-enabled" checked>头颈追踪</label><label><input type="checkbox" id="body-follow" checked>身体跟随</label><label><input type="checkbox" id="show-skeleton">显示骨骼</label><label><input type="checkbox" id="show-target" checked>显示目标</label><label><input type="checkbox" id="show-ground" checked>显示地面</label><label><input type="checkbox" id="orbit-enabled" checked>旋转视角</label></div><div id="debug-readout"></div></details>
<div class="asset-note"><span class="tiny-dot"></span> 模型 v10 · 圆润短腿版<br><small>保留原始头脸；身体更圆润，四肢更短、更厚。</small></div></aside></main>
<dialog id="comparison"><form method="dialog"><button class="close" aria-label="关闭对比">×</button></form><span class="eyebrow">SOFT SILHOUETTE</span><h2>更圆润，也更像小猫。</h2><p>同为侧视图：收掉肩臀鼓包，缩短四肢，让身体与腿部形成柔和连续的轮廓。</p><div class="comparison-grid"><figure><img src="%BASE_URL%assets/side_v9.png" alt="旧版 v9 侧面"><figcaption>之前 · v9</figcaption></figure><figure><img src="%BASE_URL%assets/side_v10.png" alt="重建 v10 侧面"><figcaption>现在 · v10</figcaption></figure></div><p class="small">Q 版比例；体表为简化材质，未制作毛发模拟。</p></dialog>
</div><script type="module" src="/src/main.js"></script></body></html>
